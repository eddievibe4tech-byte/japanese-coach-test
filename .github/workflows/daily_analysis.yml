name: Daily Analysis & Risk Assessment

on:
  schedule:
    # 每個交易日 (週一至週五) 下午 14:00 UTC (台灣時間 22:00) 執行
    - cron: '0 14 * * 1-5'
  workflow_dispatch: # 允許手動觸發

# ⚠️ 關鍵：賦予 Workflow 寫入 Repository 的權限
permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'
  FINMIND_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

jobs:
  daily-analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # 必須保留憑證，後續才能 Push
        with:
          persist-credentials: true 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Analysis (Full Mode)
        run: |
          python -m src.main --mode full   # ✅ 改用 -m，從 Repo 根目錄執行
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # ⚠️ 關鍵：將執行結果 (包含更新的 data/ 與新的 results/) 自動 Commit 回 Repo
      - name: Generate Static Review Report
        run: |
          python -m src.main --mode full
          # 靜態報告已在 main.py 中自動生成

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update daily analysis and static review [skip ci]"
          branch: main
          commit_user_name: "Sniper Bot"
          commit_user_email: "bot@sniper-system.com"
          # ✅ 確保把生成的 md/html 檔案 commit 回來
          file_pattern: 'docs/*.md docs/*.html data/*.json results/*.json'

      - name: Upload Analysis Results (Backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-results-${{ github.run_id }}
          path: |
            results/*.json
            logs/*.log
          retention-days: 7
