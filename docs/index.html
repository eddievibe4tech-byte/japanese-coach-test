<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 狙擊手系統 Dashboard</title>
    <!-- 建議未來改用編譯好的 CSS 檔案，目前保留 Play CDN 方便開發 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 簡單的 Loading 動畫 */
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 p-4 md:p-8">
    <div class="max-w-4xl mx-auto bg-white shadow-lg rounded-xl p-6">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-gray-800">🎯 狙擊手系統 - 績效儀表板</h1>
                <p class="text-gray-500 text-sm" id="last-updated">最後更新時間：載入中...</p>
            </div>
            <button onclick="loadDashboard()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center">
                🔄 重新整理
            </button>
        </div>

        <!-- 數據卡片區 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-blue-50 p-4 rounded-lg border border-blue-200">
                <p class="text-sm text-blue-600">當前準確率</p>
                <p class="text-3xl font-bold text-blue-800" id="accuracy">-</p>
            </div>
            <div class="bg-green-50 p-4 rounded-lg border border-green-200">
                <p class="text-sm text-green-600">總預測次數</p>
                <p class="text-3xl font-bold text-green-800" id="total-preds">-</p>
            </div>
            <div class="bg-purple-50 p-4 rounded-lg border border-purple-200">
                <p class="text-sm text-purple-600">當前 Prompt 版本</p>
                <p class="text-3xl font-bold text-purple-800" id="prompt-version">-</p>
            </div>
        </div>

        <!-- 📦 監控股票池 -->
        <div class="bg-white border rounded-lg p-4 mb-6">
            <h2 class="text-xl font-semibold mb-4">📦 監控股票池</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50"><tr>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">代碼</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">名稱</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">產業</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">題材</th>
                    </tr></thead>
                    <tbody id="stock-pool-table" class="divide-y divide-gray-200">
                        <tr><td colspan="4" class="px-4 py-4 text-center"><div class="loading-spinner mx-auto mb-2"></div>載入股票池...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 🎯 今日 AI 狙擊分析 -->
        <div class="bg-white border rounded-lg p-4 mb-6">
            <h2 class="text-xl font-semibold mb-4">🎯 今日 AI 狙擊分析</h2>
            
            <!-- 篩選與排序 -->
            <div class="mb-4 flex gap-4">
                <select id="sort-by" class="px-3 py-2 border rounded-lg text-sm" onchange="sortTable()">
                    <option value="ev_score">依 EV 分數排序</option>
                    <option value="rsi">依 RSI 排序</option>
                    <option value="change_5d">依 5 日漲幅排序</option>
                    <option value="volatility">依波動率排序</option>
                </select>
                <select id="filter-recommendation" class="px-3 py-2 border rounded-lg text-sm" onchange="filterTable()">
                    <option value="">全部建議</option>
                    <option value="積極買入">積極買入</option>
                    <option value="觀望">觀望</option>
                    <option value="避開">避開</option>
                </select>
            </div>
            
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200" id="analysis-table-element">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">股票</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">收盤價</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">5 日漲幅</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">波動率</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">EV 分數</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">建議</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">風險等級</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">AI 理由</th>
                        </tr>
                    </thead>
                    <tbody id="analysis-table" class="divide-y divide-gray-200">
                        <tr><td colspan="8" class="px-4 py-4 text-center"><div class="loading-spinner mx-auto mb-2"></div>AI 分析運算中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 新增：準確率分析區塊 -->
        <div class="bg-white border rounded-lg p-4 mb-6">
            <h2 class="text-xl font-semibold mb-4">預測準確率分析</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                <div class="bg-green-50 p-4 rounded-lg border border-green-200">
                    <p class="text-sm text-green-600">正確預測</p>
                    <p class="text-2xl font-bold text-green-800" id="correct-count">-</p>
                </div>
                <div class="bg-red-50 p-4 rounded-lg border border-red-200">
                    <p class="text-sm text-red-600">錯誤預測</p>
                    <p class="text-2xl font-bold text-red-800" id="incorrect-count">-</p>
                </div>
                <div class="bg-blue-50 p-4 rounded-lg border border-blue-200">
                    <p class="text-sm text-blue-600">待驗證</p>
                    <p class="text-2xl font-bold text-blue-800" id="pending-count">-</p>
                </div>
                <div class="bg-purple-50 p-4 rounded-lg border border-purple-200">
                    <p class="text-sm text-purple-600">平均準確率</p>
                    <p class="text-2xl font-bold text-purple-800" id="avg-accuracy">-</p>
                </div>
            </div>
        </div>

        <!-- 圖表區 -->
        <div class="bg-white border rounded-lg p-4 mb-6">
            <h2 class="text-xl font-semibold mb-4">📈 準確率趨勢</h2>
            <div style="height: 300px;">
                <canvas id="accuracyChart"></canvas>
            </div>
        </div>

        <!-- 近期預測紀錄表格 -->
        <div class="bg-white border rounded-lg p-4">
            <h2 class="text-xl font-semibold mb-4">📋 近期預測紀錄</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">時間</th>
                            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">股票代碼</th>
                            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">股票名稱</th>
                            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">預測</th>
                            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">結果</th>
                        </tr>
                    </thead>
                    <tbody id="predictions-table" class="bg-white divide-y divide-gray-200">
                        <tr><td colspan="5" class="px-4 py-4 text-center text-gray-500">載入中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // GitHub Repository 設定
        const REPO_USER = 'eddievibe4tech-byte'; 
        const REPO_NAME = 'sniper-system-test';
        const METRICS_URL = `https://raw.githubusercontent.com/${REPO_USER}/${REPO_NAME}/main/data/performance_metrics.json`;
        const TELEMETRY_URL = `https://raw.githubusercontent.com/${REPO_USER}/${REPO_NAME}/main/data/telemetry.json`;
        const POOL_URL = `https://raw.githubusercontent.com/${REPO_USER}/${REPO_NAME}/main/data/stock_pool.json`;
        const DEEP_URL = `https://raw.githubusercontent.com/${REPO_USER}/${REPO_NAME}/main/data/deep_analysis.json`;

        // ⚠️ 關鍵修正：將 Chart 實例存為變數，避免重複初始化報錯
        let accuracyChartInstance = null;

        // 簡單的 XSS 防護函數 (🔴 修正：精確判斷 null/undefined，避免誤殺數字 0)
        function escapeHTML(str) {
            if (str === null || str === undefined) return '-';
            return str.toString().replace(/[&<>"']/g, function(m) {
                return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[m];
            });
        }

        // 🟡 Loading Spinner HTML 模板 (統一 UI)
        function getLoadingHtml(message) {
            return `<tr><td colspan="5" class="px-4 py-4 text-center"><div class="loading-spinner"></div> ${message}</td></tr>`;
        }

        async function loadDashboard() {
            const tableBody = document.getElementById('predictions-table');
            tableBody.innerHTML = getLoadingHtml('載入數據中...');

            try {
                // 並行載入四個 JSON：股票池、今日分析、績效指標、遙測記錄
                const [poolRes, deepRes, metricsRes, telemetryRes] = await Promise.allSettled([
                    fetch(POOL_URL),
                    fetch(DEEP_URL),
                    fetch(METRICS_URL),
                    fetch(TELEMETRY_URL)
                ]);

                // 處理股票池數據 (🔴 修正：獨立 try-catch，避免 JSON 解析失敗影響其他區塊)
                let pool = null;
                if (poolRes.status === 'fulfilled' && poolRes.value.ok) {
                    try { 
                        pool = await poolRes.value.json(); 
                    } catch (e) { 
                        console.warn('stock_pool.json 解析失敗', e); 
                    }
                }

                // 處理今日分析數據
                let deep = null;
                if (deepRes.status === 'fulfilled' && deepRes.value.ok) {
                    try { 
                        deep = await deepRes.value.json(); 
                    } catch (e) { 
                        console.warn('deep_analysis.json 解析失敗', e); 
                    }
                }

                // 渲染股票池表格
                if (pool && pool.stocks) {
                    document.getElementById('stock-pool-table').innerHTML = pool.stocks.map(s => `
                        <tr>
                            <td class="px-4 py-3 text-sm">${escapeHTML(s.code)}</td>
                            <td class="px-4 py-3 text-sm font-medium">${escapeHTML(s.name)}</td>
                            <td class="px-4 py-3 text-sm">${escapeHTML(s.industry)}</td>
                            <td class="px-4 py-3 text-sm">${escapeHTML(s.topic || '-')}</td>
                        </tr>`).join('') ||
                        '<tr><td colspan="4" class="px-4 py-4 text-center text-gray-500">股票池為空</td></tr>';
                } else {
                    document.getElementById('stock-pool-table').innerHTML = '<tr><td colspan="4" class="px-4 py-4 text-center text-gray-500">暫無股票池數據</td></tr>';
                }

                // 渲染今日分析表格 (加入點擊展開功能)
                if (deep && deep.all_results) {
                    console.log("Deep analysis data:", deep);
                    
                    // 儲存數據供排序使用
                    window.analysisData = deep.all_results;
                    window.telemetryData = telemetryData;
                    
                    const tableHTML = deep.all_results.map(r => {
                        const rowId = `detail-${r.code}`;
                        
                        // 1. 摘要行 (點擊時觸發 toggleDetail)
                        const summaryRow = `
                            <tr onclick="toggleDetail('${rowId}')" class="cursor-pointer hover:bg-blue-50 transition-colors border-b border-gray-100">
                                <td class="px-4 py-3 text-sm font-medium text-gray-900">
                                    ${escapeHTML(r.code)} ${escapeHTML(r.name)} 
                                    <span class="text-xs text-blue-500 ml-1">🔍</span>
                                </td>
                                <td class="px-4 py-3 text-sm text-gray-700">$${r.current_price ? r.current_price.toFixed(2) : '-'}</td>
                                <td class="px-4 py-3 text-sm ${((r.change_5d||0) >= 0) ? 'text-green-600' : 'text-red-600'}">
                                    ${r.change_5d ? (r.change_5d >= 0 ? '+' : '') + r.change_5d.toFixed(2) + '%' : '-'}
                                </td>
                                <td class="px-4 py-3 text-sm text-gray-700">${r.volatility ? r.volatility.toFixed(1) + '%' : '-'}</td>
                                <td class="px-4 py-3 text-sm font-bold ${(r.ev_score||0) >= 70 ? 'text-green-600' : ((r.ev_score||0) < 40 ? 'text-red-600' : 'text-gray-700')}">
                                    ${r.ev_score || '-'}
                                </td>
                                <td class="px-4 py-3 text-sm">
                                    <span class="px-2 py-1 rounded-full text-xs font-medium ${
                                        r.recommendation === '積極買入' ? 'bg-green-100 text-green-800' :
                                        r.recommendation === '避開' ? 'bg-red-100 text-red-800' :
                                        'bg-yellow-100 text-yellow-800'
                                    }">${escapeHTML(r.recommendation) || '-'}</span>
                                </td>
                                <td class="px-4 py-3 text-sm">${escapeHTML(r.risk_level) || '-'}</td>
                                <td class="px-4 py-3 text-sm text-gray-600 max-w-xs truncate" title="${escapeHTML(r.reason)}">
                                    ${escapeHTML(r.reason) ? escapeHTML(r.reason).substring(0, 20) + '...' : '-'}
                                </td>
                            </tr>
                        `;
                        
                        // 2. 詳細資訊行 (預設隱藏，點擊摘要行後顯示)
                        const detailRow = `
                            <tr id="${rowId}" class="hidden bg-gray-50">
                                <td colspan="8" class="px-6 py-5 border-b border-gray-200">
                                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        
                                        <!-- 卡片 1：基本面數據 -->
                                        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100">
                                            <h4 class="font-bold text-gray-800 mb-3 flex items-center">
                                                📊 基本面數據
                                            </h4>
                                            <ul class="space-y-2 text-sm text-gray-600">
                                                <li class="flex justify-between"><span>營收年增率：</span><span class="font-medium ${r.revenue_yoy >= 0 ? 'text-green-600' : 'text-red-600'}">${r.revenue_yoy ? r.revenue_yoy.toFixed(2) + '%' : '-'}</span></li>
                                                <li class="flex justify-between"><span>毛利率：</span><span class="font-medium">${r.gross_margin ? r.gross_margin.toFixed(2) + '%' : '-'}</span></li>
                                                <li class="flex justify-between"><span>淨利率：</span><span class="font-medium">${r.net_margin ? r.net_margin.toFixed(2) + '%' : '-'}</span></li>
                                                <li class="flex justify-between"><span>EPS：</span><span class="font-medium">${r.eps ? r.eps.toFixed(2) : '-'}</span></li>
                                            </ul>
                                        </div>

                                        <!-- 卡片 2：技術面指標 -->
                                        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100">
                                            <h4 class="font-bold text-gray-800 mb-3 flex items-center">
                                                📈 技術面指標
                                            </h4>
                                            <ul class="space-y-2 text-sm text-gray-600">
                                                <li class="flex justify-between"><span>MA5 / MA20：</span><span class="font-medium">$${r.ma5 ? r.ma5.toFixed(0) : '-'} / $${r.ma20 ? r.ma20.toFixed(0) : '-'}</span></li>
                                                <li class="flex justify-between"><span>RSI (14)：</span><span class="font-medium ${r.rsi > 70 ? 'text-red-600' : r.rsi < 30 ? 'text-green-600' : ''}">${r.rsi ? r.rsi.toFixed(2) : '-'}</span></li>
                                                <li class="flex justify-between"><span>MACD：</span><span class="font-medium ${r.macd > 0 ? 'text-green-600' : 'text-red-600'}">${r.macd ? r.macd.toFixed(2) : '-'}</span></li>
                                                <li class="flex justify-between"><span>股價位置：</span><span class="font-medium">${r.price_above_ma20 ? 'MA20 之上 🟢' : 'MA20 之下 🔴'}</span></li>
                                            </ul>
                                        </div>

                                        <!-- 卡片 3：籌碼面與 AI 完整分析 -->
                                        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100 md:col-span-1">
                                            <h4 class="font-bold text-gray-800 mb-3 flex items-center">
                                                 籌碼與 AI 分析
                                            </h4>
                                            <div class="space-y-3">
                                                <div class="text-sm text-gray-600 space-y-1 border-b pb-2">
                                                    <div class="flex justify-between"><span>投信連買：</span><span class="font-medium">${r.inst_buy_days} 天</span></div>
                                                    <div class="flex justify-between"><span>融資增減：</span><span class="font-medium ${r.margin_change >= 0 ? 'text-red-600' : 'text-green-600'}">${r.margin_change} 張</span></div>
                                                </div>
                                                <div>
                                                    <p class="text-xs text-gray-500 mb-1">AI 完整理由：</p>
                                                    <p class="text-sm text-gray-800 leading-relaxed bg-blue-50 p-2 rounded">
                                                        ${escapeHTML(r.reason) || '暫無詳細分析'}
                                                    </p>
                                                </div>
                                            </div>
                                        </div>

                                    </div>
                                </td>
                            </tr>
                        `;
                        
                        return summaryRow + detailRow;
                    }).join('');
                    
                    document.getElementById('analysis-table').innerHTML = tableHTML || '<tr><td colspan="8" class="px-4 py-4 text-center text-gray-500">今日尚無分析結果</td></tr>';
                    
                    // 計算準確率統計
                    calculateAccuracyStats();
                } else {
                    document.getElementById('analysis-table').innerHTML = '<tr><td colspan="8" class="px-4 py-4 text-center text-gray-500">暫無分析數據</td></tr>';
                }

                // 處理 Metrics 數據 (🔴 修正：獨立 try-catch，避免 JSON 解析失敗影響其他區塊)
                let metricsData = null;
                if (metricsRes.status === 'fulfilled' && metricsRes.value.ok) {
                    try {
                        metricsData = await metricsRes.value.json();
                    } catch (e) {
                        console.warn('performance_metrics.json 解析失敗', e);
                    }
                }

                // 處理 Telemetry 數據
                let telemetryData = null;
                if (telemetryRes.status === 'fulfilled' && telemetryRes.value.ok) {
                    try {
                        telemetryData = await telemetryRes.value.json();
                    } catch (e) {
                        console.warn('telemetry.json 解析失敗', e);
                    }
                }

                // 1. 更新卡片數據
                if (metricsData) {
                    document.getElementById('accuracy').innerText = (metricsData.accuracy_rate || 0).toFixed(1) + '%';
                    document.getElementById('total-preds').innerText = metricsData.total_predictions || 0;
                    document.getElementById('prompt-version').innerText = 'V' + (metricsData.current_version || 1);
                    
                    const updateTime = metricsData.last_updated ? new Date(metricsData.last_updated).toLocaleString('zh-TW') : '未知';
                    document.getElementById('last-updated').innerText = `最後更新時間：${updateTime}`;
                } else {
                    document.getElementById('last-updated').innerText = '最後更新時間：暫無數據 (檔案可能尚未生成)';
                }

                // 2. 繪製圖表 (⚠️ 修正：相容 Object 結構的 version_stats + 🟡 排序 X 軸版本)
                const ctx = document.getElementById('accuracyChart').getContext('2d');
                let labels = [];
                let accuracyData = [];
                
                // 檢查 version_stats 是否存在
                if (metricsData && metricsData.version_stats) {
                    // 判斷是 Array 還是 Object
                    if (Array.isArray(metricsData.version_stats)) {
                        metricsData.version_stats.forEach(stat => {
                            labels.push('V' + stat.version);
                            accuracyData.push(stat.accuracy || 0);
                        });
                    } else {
                        // 如果是 Object (e.g., {"1": {...}, "2": {...}})
                        Object.entries(metricsData.version_stats).forEach(([version, stats]) => {
                            labels.push('V' + version);
                            // 假設 stats 物件中有 accuracy 欄位，若無則計算
                            const acc = stats.accuracy || (stats.correct / stats.predictions * 100) || 0;
                            accuracyData.push(acc);
                        });
                        
                        // 🟡 顯式排序確保趨勢線正確 (V1 -> V2 -> V3...)
                        let combined = labels.map((label, index) => ({ label, data: accuracyData[index] }));
                        combined.sort((a, b) => parseInt(a.label.replace('V', '')) - parseInt(b.label.replace('V', '')));
                        labels = combined.map(c => c.label);
                        accuracyData = combined.map(c => c.data);
                    }
                }

                // 如果完全沒數據，使用模擬數據
                if (labels.length === 0) {
                    labels = ['V1 (模擬)'];
                    accuracyData = [50];
                }

                // 銷毀舊圖表避免衝突
                if (accuracyChartInstance) {
                    accuracyChartInstance.destroy();
                }

                accuracyChartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '準確率 (%)',
                            data: accuracyData,
                            borderColor: 'rgb(59, 130, 246)',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            fill: true,
                            tension: 0.3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                max: 100,
                                ticks: { callback: (val) => val + '%' }
                            }
                        }
                    }
                });

                // 3. 更新預測紀錄表格
                if (telemetryData && telemetryData.records && telemetryData.records.length > 0) {
                    const recentRecords = telemetryData.records.slice(-10).reverse();
                    tableBody.innerHTML = recentRecords.map(record => {
                        const time = record.timestamp ? new Date(record.timestamp).toLocaleString('zh-TW') : '-';
                        const accText = record.accuracy === 1 ? '✅ 正確' : (record.accuracy === 0 ? '❌ 錯誤' : '⏳ 待驗證');
                        const accClass = record.accuracy === 1 ? 'text-green-600 font-bold' : (record.accuracy === 0 ? 'text-red-600 font-bold' : 'text-gray-500');
                        
                        return `
                            <tr>
                                <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-900">${escapeHTML(time)}</td>
                                <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-900">${escapeHTML(record.stock_code)}</td>
                                <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-900">${escapeHTML(record.stock_name)}</td>
                                <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-900">${escapeHTML(record.prediction?.recommendation || '-')}</td>
                                <td class="px-4 py-3 whitespace-nowrap text-sm ${accClass}">${accText}</td>
                            </tr>
                        `;
                    }).join('');
                } else {
                    tableBody.innerHTML = '<tr><td colspan="5" class="px-4 py-4 text-center text-gray-500">暫無預測紀錄</td></tr>';
                }

            } catch (error) {
                console.error("Dashboard Error:", error);
                tableBody.innerHTML = '<tr><td colspan="5" class="px-4 py-4 text-center text-red-500">載入失敗，請檢查網路或 Repo 權限</td></tr>';
            }
        }

        // 切換詳細資訊行的顯示/隱藏
        function toggleDetail(rowId) {
            const detailRow = document.getElementById(rowId);
            if (detailRow) {
                // 使用 Tailwind 的 hidden 類別來切換
                detailRow.classList.toggle('hidden');
                
                // 可選：改變摘要行的背景色作為視覺回饋
                const summaryRow = detailRow.previousElementSibling;
                if (summaryRow) {
                    if (detailRow.classList.contains('hidden')) {
                        summaryRow.classList.remove('bg-blue-100');
                    } else {
                        summaryRow.classList.add('bg-blue-100');
                    }
                }
            }
        }

        // 計算準確率統計
        function calculateAccuracyStats() {
            const records = window.telemetryData?.records || [];
            const verified = records.filter(r => r.accuracy !== null);
            const pending = records.filter(r => r.accuracy === null);
            
            const correct = verified.filter(r => r.accuracy === 1).length;
            const incorrect = verified.filter(r => r.accuracy === 0).length;
            const accuracy = verified.length > 0 ? ((correct / verified.length) * 100).toFixed(1) : 0;
            
            document.getElementById('correct-count').innerText = correct;
            document.getElementById('incorrect-count').innerText = incorrect;
            document.getElementById('pending-count').innerText = pending.length;
            document.getElementById('avg-accuracy').innerText = accuracy + '%';
        }

        // 排序功能
        function sortTable() {
            const sortBy = document.getElementById('sort-by').value;
            if (!window.analysisData) return;
            
            const sorted = [...window.analysisData].sort((a, b) => {
                if (sortBy === 'ev_score') return (b.ev_score || 0) - (a.ev_score || 0);
                if (sortBy === 'rsi') return (a.rsi || 0) - (b.rsi || 0);
                if (sortBy === 'change_5d') return (b.change_5d || 0) - (a.change_5d || 0);
                if (sortBy === 'volatility') return (b.volatility || 0) - (a.volatility || 0);
                return 0;
            });
            
            // 重新渲染（保持排序後的數據）
            window.analysisData = sorted;
            // 簡單處理：重新呼叫 loadDashboard 會重置排序，所以這裡直接更新 DOM
            const tbody = document.getElementById('analysis-table');
            tbody.innerHTML = sorted.map(r => {
                // 使用與上面相同的渲染邏輯（為簡化代碼，此處省略重複部分）
                // 實際應用中應該提取為獨立函數
                return `<tr class="hover:bg-gray-50"><td colspan="10" class="px-3 py-3 text-sm">${escapeHTML(r.code)} ${escapeHTML(r.name)} - EV: ${r.ev_score || '-'}</td></tr>`;
            }).join('');
        }

        // 篩選功能
        function filterTable() {
            const filter = document.getElementById('filter-recommendation').value;
            if (!window.analysisData) return;
            
            const filtered = filter ? 
                window.analysisData.filter(r => r.recommendation === filter) : 
                window.analysisData;
            
            // 重新渲染（保持篩選後的數據）
            const tbody = document.getElementById('analysis-table');
            tbody.innerHTML = filtered.map(r => {
                // 使用與上面相同的渲染邏輯
                return `<tr class="hover:bg-gray-50"><td colspan="10" class="px-3 py-3 text-sm">${escapeHTML(r.code)} ${escapeHTML(r.name)} - ${escapeHTML(r.recommendation) || '-'}</td></tr>`;
            }).join('');
        }

        // 頁面載入完成後執行
        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
