<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日語學習 RPG 教練</title>
  <meta name="description" content="結合 AI 與 Habitica 的日語學習工具">
  
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-100 min-h-screen">
  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-lg">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold">🗡️ 日語學習 RPG 教練</h1>
      <nav class="space-x-4">
        <button id="nav-home" class="hover:text-indigo-200 transition">首頁</button>
        <button id="nav-settings" class="hover:text-indigo-200 transition">設定</button>
        <button id="nav-stats" class="hover:text-indigo-200 transition">統計</button>
        <button id="auth-btn" class="bg-white text-indigo-600 px-4 py-2 rounded-lg font-semibold hover:bg-indigo-50 transition">登入</button>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container mx-auto px-4 py-8">
    
    <!-- Auth Section -->
    <section id="auth-section" class="max-w-md mx-auto bg-white rounded-xl shadow-md p-6 mb-8 hidden">
      <h2 class="text-2xl font-bold mb-4 text-gray-800">帳號認證</h2>
      <form id="auth-form" class="space-y-4">
        <div>
          <label class="block text-gray-700 font-medium mb-2">電子郵件</label>
          <input type="email" id="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-gray-700 font-medium mb-2">密碼</label>
          <input type="password" id="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="flex space-x-4">
          <button type="submit" id="signin-btn" class="flex-1 bg-indigo-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">登入</button>
          <button type="button" id="signup-btn" class="flex-1 bg-green-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-green-700 transition">註冊</button>
        </div>
      </form>
    </section>

    <!-- App Section (shown after login) -->
    <section id="app-section" class="hidden">
      
      <!-- User Info -->
      <div class="bg-white rounded-xl shadow-md p-6 mb-8">
        <div class="flex justify-between items-center">
          <div>
            <h2 class="text-xl font-bold text-gray-800">歡迎回來，<span id="user-email" class="text-indigo-600"></span></h2>
            <p class="text-gray-600 mt-1">當前等級：<span id="current-level" class="font-semibold">五十音</span></p>
          </div>
          <button id="logout-btn" class="text-red-600 hover:text-red-800 font-medium transition">登出</button>
        </div>
        
        <!-- Game Stats -->
        <div class="grid grid-cols-3 gap-4 mt-6">
          <div class="bg-indigo-50 rounded-lg p-4 text-center">
            <p class="text-gray-600 text-sm">能量</p>
            <p id="energy-display" class="text-2xl font-bold text-indigo-600">100</p>
          </div>
          <div class="bg-green-50 rounded-lg p-4 text-center">
            <p class="text-gray-600 text-sm">完成任務數</p>
            <p id="tasks-completed-display" class="text-2xl font-bold text-green-600">0</p>
          </div>
          <div class="bg-purple-50 rounded-lg p-4 text-center">
            <p class="text-gray-600 text-sm">解鎖階段</p>
            <p id="stages-unlocked-display" class="text-2xl font-bold text-purple-600">1</p>
          </div>
        </div>
      </div>

      <!-- Task Generator -->
      <div class="grid md:grid-cols-2 gap-8">
        
        <!-- Generate Task Form -->
        <div class="bg-white rounded-xl shadow-md p-6">
          <h3 class="text-xl font-bold text-gray-800 mb-4">✨ 生成今日任務</h3>
          <form id="task-form" class="space-y-4">
            <div>
              <label class="block text-gray-700 font-medium mb-2">當前日語等級</label>
              <select id="level-select" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="五十音">五十音</option>
                <option value="N5">N5</option>
                <option value="N4">N4</option>
                <option value="N3">N3</option>
                <option value="N2">N2</option>
                <option value="N1">N1</option>
              </select>
            </div>
            <div>
              <label class="block text-gray-700 font-medium mb-2">今日狀態</label>
              <textarea id="status-input" rows="3" placeholder="例如：今天有點累，想要輕鬆一點的練習..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-4 py-3 rounded-lg font-bold hover:from-indigo-700 hover:to-purple-700 transition transform hover:scale-105">
              🤖 AI 生成任務
            </button>
          </form>
        </div>

        <!-- Generated Tasks Preview -->
        <div class="bg-white rounded-xl shadow-md p-6">
          <h3 class="text-xl font-bold text-gray-800 mb-4">📋 任務預覽</h3>
          <div id="tasks-preview" class="space-y-4">
            <p class="text-gray-500 text-center py-8">點擊「AI 生成任務」來產生今日學習任務</p>
          </div>
          <button id="push-habitica-btn" class="w-full mt-4 bg-green-600 text-white px-4 py-3 rounded-lg font-bold hover:bg-green-700 transition hidden">
            🚀 推送到 Habitica
          </button>
        </div>
      </div>

      <!-- Settings Section -->
      <div class="mt-8 bg-white rounded-xl shadow-md p-6">
        <h3 class="text-xl font-bold text-gray-800 mb-4">⚙️ API 設定</h3>
        <form id="settings-form" class="space-y-4">
          <div class="grid md:grid-cols-2 gap-4">
            <div>
              <label class="block text-gray-700 font-medium mb-2">Habitica User ID</label>
              <input type="text" id="habitica-user-id" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-gray-700 font-medium mb-2">Habitica API Token</label>
              <input type="password" id="habitica-token" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="md:col-span-2">
              <label class="block text-gray-700 font-medium mb-2">Groq API Key</label>
              <input type="password" id="groq-api-key" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
          </div>
          <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">
            💾 儲存設定
          </button>
        </form>
      </div>

    </section>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-800 text-white mt-12 py-6">
    <div class="container mx-auto px-4 text-center">
      <p>&copy; 2024 日語學習 RPG 教練。Made with ❤️ using Supabase + Groq + Habitica</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script type="module" src="js/supabase.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/groq.js"></script>
  <script type="module" src="js/habitica.js"></script>
  <script type="module" src="js/app.js"></script>
  
  <!-- Register Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('✅ Service Worker registered'))
          .catch(err => console.log('❌ SW registration failed:', err))
      })
    }
  </script>
</body>
</html>
